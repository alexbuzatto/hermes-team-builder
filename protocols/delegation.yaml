# Mapeamento de Delegação e Rotas Inteligentes para o Hermes Agent
version: "1.0.0"
strategy: "profile_routes"
orchestrator:
  profile: "default"
  agent: "hermes"

routes:
  - agent: "athena"
    profile: "athena"
    triggers:
      - "requisitos"
      - "produto"
      - "escopo"
      - "user story"
      - "historia de usuario"
      - "criterio de aceitacao"
      - "pesquisa de mercado"
      - "mvp"

  - agent: "atlas"
    profile: "atlas"
    triggers:
      - "arquitetura"
      - "stack"
      - "banco de dados"
      - "modelagem"
      - "diagrama"
      - "adr"
      - "estrutura de pastas"
      - "padrao de projeto"

  - agent: "tesla"
    profile: "tesla"
    triggers:
      - "integracao"
      - "api contrato"
      - "mensageria"
      - "protocolo"
      - "rest"
      - "graphql"
      - "grpc"
      - "rabbitmq"
      - "kafka"
      - "webhook"

  - agent: "ada"
    profile: "ada"
    triggers:
      - "backend"
      - "servidor"
      - "api rest"
      - "endpoint"
      - "banco"
      - "orm"
      - "regras de negocio"
      - "autenticacao"
      - "jwt"
      - "fastapi"
      - "nodejs"

  - agent: "linus"
    profile: "linus"
    triggers:
      - "frontend"
      - "tela"
      - "interface"
      - "react"
      - "componente"
      - "vue"
      - "nextjs"
      - "css"
      - "tailwind"
      - "acessibilidade"

  - agent: "iris"
    profile: "iris"
    triggers:
      - "design"
      - "ux"
      - "ui"
      - "wireframe"
      - "design system"
      - "paleta de cores"
      - "tipografia"
      - "layout"
      - "prototipo"

  - agent: "sherlock"
    profile: "sherlock"
    triggers:
      - "qa"
      - "teste"
      - "validar"
      - "bug"
      - "defeito"
      - "regressao"
      - "pytest"
      - "jest"
      - "cobertura"

  - agent: "sentinel"
    profile: "sentinel"
    triggers:
      - "seguranca"
      - "vulnerabilidade"
      - "auditoria"
      - "owasp"
      - "segredo"
      - "credencial"
      - "permissao"
      - "cve"
      - "sanitizacao"

  - agent: "nova"
    profile: "nova"
    triggers:
      - "devops"
      - "docker"
      - "container"
      - "pipeline"
      - "ci cd"
      - "deploy"
      - "infraestrutura"
      - "docker-compose"
      - "rollback"

  - agent: "scribe"
    profile: "scribe"
    triggers:
      - "documentacao"
      - "readme"
      - "manual"
      - "tutorial"
      - "changelog"
      - "guia"
      - "api docs"

  - agent: "arbiter"
    profile: "arbiter"
    triggers:
      - "revisao"
      - "code review"
      - "auditoria final"
      - "aprovar"
      - "reprovar"
      - "parecer tecnico"
      - "conformidade"
